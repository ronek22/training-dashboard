# Runs the same `just check` as locally: frontend tests, frontend build, backend and helper tests.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Versions match the Docker images (backend python:3.12-slim, frontend node:20-alpine).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install just
        run: pip install rust-just==1.59.0

      - name: Set up test environments
        run: just setup-checks

      - name: Run checks
        run: just check
