<!--
  Phone chrome for iOS artboards, matching the app on iOS 26 (iPhone 17 Pro, 393 x 852 pt).
  Copy the <style> block into the artboard's <helmet> after the shared CSS, and the markup into
  each .phone. Measured from a simulator screenshot on 2026-11-03; re-measure if the app changes.

  - Tab bar: the system Liquid Glass bar, floating 21 pt from the sides, 62 pt tall, 18 pt above
    the bottom edge, fully rounded. Selected tab sits in a lighter inner pill, icon and label volt.
    Five tabs: Today (clock) · Plan (calendar) · Coach (bubbles) · Food (fork and knife) ·
    Activities (waveform). Content scrolls under it; a short fade sits behind it.
  - Status bar: time left, Wi-Fi + battery right, Dynamic Island centred.
-->
<style>
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:40}
.sb{height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 50px;font-weight:600;font-size:16px;box-sizing:border-box;position:relative;z-index:35}
.sb .ic{display:flex;gap:6px;align-items:center}
.tabfade{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to bottom,rgba(10,12,17,0),rgba(10,12,17,.92) 55%);z-index:14;pointer-events:none}
.tabbar{position:absolute;left:21px;right:21px;bottom:18px;height:62px;border-radius:31px;background:rgba(28,30,36,.94);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 8px 24px rgba(0,0,0,.45);display:flex;align-items:center;padding:0 4px;box-sizing:border-box;z-index:15}
.tab{flex:1;height:54px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:#F3F5F9}
.tab svg{width:24px;height:24px}
.tab.on{background:#3E4048;color:#E9F76A}
.home{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#F3F5F9;z-index:45}
</style>

<!-- status bar -->
<div class="island"></div>
<div class="sb"><span>9:41</span><span class="ic"><svg width="17" height="12" viewBox="0 0 17 12" fill="#F3F5F9"><path d="M8.5 2.2c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8.5.5 10.2 10.2 0 0 0 1.3 3.4l1.2 1.2a8.5 8.5 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2a6.8 6.8 0 0 0-9.6 0L4.9 7a5.1 5.1 0 0 1 3.6-1.4zm0 3.4c.5 0 .9.2 1.2.5L8.5 10.7 7.3 9.5c.3-.3.7-.5 1.2-.5z"/></svg><svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="#8A93A6"/><rect x="2.5" y="2.5" width="19" height="8" rx="2" fill="#F3F5F9"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="#8A93A6"/></svg></span></div>

<!-- tab bar (move class="on" to the screen's tab) -->
<div class="tabfade"></div>
<div class="tabbar">
<div class="tab on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 6.5V12h4" stroke="#3E4048" stroke-width="2" stroke-linecap="round" fill="none"/></svg>Today</div>
<div class="tab"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="17" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 8.5h18" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="12.5" r="1.1"/><circle cx="12" cy="12.5" r="1.1"/><circle cx="16" cy="12.5" r="1.1"/><circle cx="8" cy="16.5" r="1.1"/><circle cx="12" cy="16.5" r="1.1"/><circle cx="16" cy="16.5" r="1.1"/></svg>Plan</div>
<div class="tab"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.5 4.5A2.5 2.5 0 0 1 5 2h9a2.5 2.5 0 0 1 2.5 2.5v6A2.5 2.5 0 0 1 14 13H7.5l-3.5 3v-3.2a2.5 2.5 0 0 1-1.5-2.3z"/><path d="M18 7h1a2.5 2.5 0 0 1 2.5 2.5v6a2.5 2.5 0 0 1-1.5 2.3V21l-3.5-3H11a2.5 2.5 0 0 1-2.5-2.5V15H14a4 4 0 0 0 4-4z"/></svg>Coach</div>
<div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 2.5v7a2.5 2.5 0 0 0 5 0v-7M8.5 2.5v19M17.5 21.5v-19c-2.5 1.5-3.5 5-3.5 8.5h3.5"/></svg>Food</div>
<div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12.5h4.5l2.5-7 5 13 2.5-6H22"/></svg>Activities</div>
</div>
<div class="home"></div>
