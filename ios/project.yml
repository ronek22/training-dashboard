# Source of truth for TrainLog.xcodeproj. After adding or moving files run `xcodegen` in ios/.
name: TrainLog
options:
  bundleIdPrefix: com.ronek22
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  TrainLog:
    type: application
    platform: iOS
    sources:
      - path: TrainLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronek22.trainlog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_CFBundleDisplayName: TrainLog
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: TrainLog talks to the TrainLog server on your Mac over home Wi-Fi.
    info:
      path: TrainLog/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - BarlowCondensed-SemiBold.ttf
          - BarlowCondensed-Bold.ttf
          - BarlowCondensed-ExtraBold.ttf
          - BarlowCondensed-BoldItalic.ttf
          - BarlowCondensed-ExtraBoldItalic.ttf
          - Archivo-Regular.ttf
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
  TrainLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrainLogTests
    dependencies:
      - target: TrainLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronek22.trainlog.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TrainLog.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TrainLog
schemes:
  TrainLog:
    build:
      targets:
        TrainLog: all
        TrainLogTests: [test]
    test:
      targets:
        - TrainLogTests
