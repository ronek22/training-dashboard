services:
  backend:
    build: ./backend
    container_name: training-backend
    ports:
      - "8000:8000"
    environment:
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REFRESH_TOKEN: ${STRAVA_REFRESH_TOKEN:-}
      HEALTHFIT_DIR: /healthfit
      HEALTH_DATA_EXPORT_DIR: /health-data-export
      HEALTH_DATA_AUTO_IMPORT: ${HEALTH_DATA_AUTO_IMPORT:-true}
      HEALTH_DATA_IMPORT_INTERVAL_SECONDS: ${HEALTH_DATA_IMPORT_INTERVAL_SECONDS:-900}
    volumes:
      - ./data:/data
      - ./backend/app:/app/app
      - ./docs:/app/docs:ro
      - type: bind
        source: ${HEALTHFIT_EXPORT_DIR:-./data/healthfit-inbox}
        target: /healthfit
        read_only: true
      - type: bind
        source: ${HEALTH_DATA_EXPORT_DIR:-./data/health-data-export-inbox}
        target: /health-data-export
        read_only: true
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: training-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped
