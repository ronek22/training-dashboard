services:
  backend:
    build: ./backend
    container_name: training-backend
    ports:
      - "8000:8000"
    environment:
      # Local day boundaries for date.today() (widget, plans, check-ins).
      TZ: ${TZ:-Europe/Warsaw}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REFRESH_TOKEN: ${STRAVA_REFRESH_TOKEN:-}
      MAPY_API_KEY: ${MAPY_API_KEY:-}
      HEALTHFIT_DIR: /healthfit
      HEALTH_DATA_EXPORT_DIR: /health-data-export
      HEALTH_DATA_AUTO_IMPORT: ${HEALTH_DATA_AUTO_IMPORT:-true}
      HEALTH_DATA_IMPORT_INTERVAL_SECONDS: ${HEALTH_DATA_IMPORT_INTERVAL_SECONDS:-900}
      WIDGET_EXPORT_DIR: /widget-export
    volumes:
      - ./data:/data
      - ./backend/app:/app/app
      - ./docs:/app/docs:ro
      - type: bind
        source: ${HEALTHFIT_EXPORT_DIR:-./data/healthfit-inbox}
        target: /healthfit
        read_only: true
      - type: bind
        source: ${HEALTH_DATA_EXPORT_DIR:-./data/health-data-export-inbox}
        target: /health-data-export
        read_only: true
      # iPhone widget file; point TRAINLOG_WIDGET_DIR at an iCloud Drive folder (docs/iphone.md).
      - type: bind
        source: ${TRAINLOG_WIDGET_DIR:-./data/widget-export}
        target: /widget-export
        bind:
          create_host_path: true
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: training-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public:ro
    depends_on:
      - backend
    restart: unless-stopped
