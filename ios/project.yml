# Source of truth for TrainLog.xcodeproj. After adding or moving files run `xcodegen` in ios/.
name: TrainLog
options:
  bundleIdPrefix: com.ronek22
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7LNZV748SW
    CODE_SIGN_STYLE: Automatic
targets:
  TrainLog:
    type: application
    platform: iOS
    sources:
      - path: TrainLog
      - path: Shared
    dependencies:
      - target: TrainLogWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronek22.trainlog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_CFBundleDisplayName: TrainLog
        INFOPLIST_KEY_NSCameraUsageDescription: TrainLog photographs meals so Claude can estimate calories and protein.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: TrainLog talks to the TrainLog server on your Mac over home Wi-Fi.
        INFOPLIST_KEY_NSHealthShareUsageDescription: TrainLog reads workouts, sleep, heart rate, HRV, steps and weight from Apple Health and sends them to your Mac for training and recovery tracking.
    entitlements:
      path: TrainLog/TrainLog.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.com.ronek22.trainlog]
    info:
      path: TrainLog/Info.plist
      properties:
        # Rest timer on the Lock Screen and in the Dynamic Island (Features/Strength/StrengthActivity.swift).
        NSSupportsLiveActivities: true
        # Widgets and the Live Activity open trainlog://today, food, plan or strength.
        CFBundleURLTypes:
          - CFBundleURLName: com.ronek22.trainlog
            CFBundleURLSchemes: [trainlog]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Settings › Find on this Wi-Fi browses these to find Macs (ServerFinder.serviceTypes).
        NSBonjourServices:
          - _companion-link._tcp
          - _airplay._tcp
          - _ssh._tcp
          - _smb._tcp
          - _rfb._tcp
        UIAppFonts:
          - BarlowCondensed-SemiBold.ttf
          - BarlowCondensed-Bold.ttf
          - BarlowCondensed-ExtraBoldItalic.ttf
          - Archivo.ttf
  TrainLogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TrainLogWidgets
      - path: Shared
      - path: TrainLog/Design/Theme.swift
      - path: TrainLog/API/PhoneToday.swift
      - path: TrainLog/API/Food.swift
      - path: TrainLog/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronek22.trainlog.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TrainLog
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: TrainLog widgets refresh from the TrainLog server on your Mac over home Wi-Fi.
    entitlements:
      path: TrainLogWidgets/TrainLogWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ronek22.trainlog]
    info:
      path: TrainLogWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - BarlowCondensed-SemiBold.ttf
          - BarlowCondensed-Bold.ttf
          - BarlowCondensed-ExtraBoldItalic.ttf
          - Archivo.ttf
  TrainLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrainLogTests
    dependencies:
      - target: TrainLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronek22.trainlog.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TrainLog.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TrainLog
schemes:
  TrainLog:
    build:
      targets:
        TrainLog: all
        TrainLogTests: [test]
    test:
      targets:
        - TrainLogTests
