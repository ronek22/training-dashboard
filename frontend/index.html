<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TrainLog</title>
  <meta name="theme-color" content="#0b1018" />
  <meta name="color-scheme" content="dark light" />
  <script>
    (function () {
      var mode = 'auto';
      try { mode = localStorage.getItem('training-dashboard-theme') || 'auto'; } catch (e) {}
      var light = mode === 'light' || (mode !== 'dark' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
      var root = document.documentElement;
      root.dataset.theme = light ? 'light' : 'dark';
      root.style.colorScheme = light ? 'light' : 'dark';
      root.style.backgroundColor = light ? '#f3f5f9' : '#0b1018';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', light ? '#f3f5f9' : '#0b1018');
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TrainLog" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
